# Perfil de produção: ative com SPRING_PROFILES_ACTIVE=production
# Todas as credenciais devem ser fornecidas por variáveis de ambiente.

# Banco de dados (sem valores padrão)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Segredo JWT obrigatório (sem valor padrão)
jwt.secret=${JWT_SECRET_KEY}

# Nunca limpar o banco automaticamente em produção
spring.flyway.clean-disabled=true

# Desabilita ferramentas e logs de desenvolvimento
spring.graphql.graphiql.enabled=false
spring.jpa.show-sql=false
logging.level.org.springframework.graphql=INFO
spring.graphql.show-details=never
spring.graphql.errors.show-details=never
spring.graphql.show-architecture-errors=false
