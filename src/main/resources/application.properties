spring.application.name=api

spring.datasource.url=jdbc:mysql://localhost:3307/japim?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

server.port=8081
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.exception-handler.enabled=true
spring.graphql.show-architecture-errors=true
spring.jackson.serialization.indent_output=true
logging.level.org.springframework.graphql=DEBUG
spring.graphql.show-details=always
spring.graphql.errors.show-details=always