spring.application.name=api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/japim?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.main.allow-circular-references=true
spring.flyway.depends-on=entityManagerFactory

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=false

server.port=${PORT:8080}
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.exception-handler.enabled=true
spring.graphql.show-architecture-errors=true
spring.jackson.serialization.indent_output=true
logging.level.org.springframework.graphql=DEBUG
spring.graphql.show-details=always
spring.graphql.errors.show-details=always

jwt.secret=${JWT_SECRET_KEY:M31I8d2YKkEH+2mthqsOW5GeJofkNPwOPKOIf4iopfo=}
jwt.expiration=86400000